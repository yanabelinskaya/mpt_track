<!-- Модальное окно удаления преподавателя -->
<div class="modal fade" id="deleteTeacherModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <div class="w-100 text-center">
                    <div class="modal-icon-danger mb-3">
                        <i class="bi bi-trash"></i>
                    </div>
                    <h5 class="modal-title">Удаление преподавателя</h5>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center pt-0">
                <p class="mb-3">Вы действительно хотите удалить преподавателя <strong id="teacherNameToDelete">—</strong>?</p>
                <p class="text-muted mb-0">Вместе с учетной записью будут удалены все связанные с ним данные входа.</p>
            </div>
            <div class="modal-footer border-0 justify-content-center">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x"></i> Отмена
                </button>
                <button type="button" class="btn btn-danger" id="confirmDeleteTeacherBtn" onclick="confirmDeleteTeacher()">
                    <i class="bi bi-trash"></i> Удалить
                </button>
            </div>
        </div>
    </div>
</div>
